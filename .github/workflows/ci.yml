name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANAV_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/setup-dotnet@v6
        if: matrix.compiler == 'gcc'
        with:
          dotnet-version: 10.0.x

      - name: C# client integration (real server, test world from the e2e tests)
        if: matrix.compiler == 'gcc'
        run: tests/run_client_integration.sh build/bin/AmeisenNavigation.Server

      - name: Upload binaries
        if: matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v7
        with:
          name: AmeisenNavigation-linux-x64
          path: |
            build/bin/AmeisenNavigation.Server
            build/bin/AmeisenNavigation.Exporter

  sanitizers:
    name: Linux (ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DANAV_SANITIZE=ON
          -DANAV_ENABLE_LTO=OFF -DANAV_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        # StormLib is built from source here, the prebuilt dep/ library may come from a newer toolset.
        run: cmake -S . -B build -A x64 -DANAV_USE_BUNDLED_STORMLIB=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: AmeisenNavigation-windows-x64
          path: |
            build/bin/Release/AmeisenNavigation.Server.exe
            build/bin/Release/AmeisenNavigation.Exporter.exe

  dotnet:
    name: .NET client and tester
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build client libraries
        run: dotnet build AmeisenNavigation.Client/AmeisenNavigation.Client.csproj -c Release -warnaserror

      - name: Build tester
        run: dotnet build AmeisenNavigation.Tester/AmeisenNavigation.Tester.csproj -c Release

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: docker build -t ameisennav .

      - name: Smoke test
        run: |
          docker run --rm ameisennav server --version
          docker run --rm ameisennav exporter --help
          mkdir -p meshes
          docker run -d --name anav -p 127.0.0.1:47110:47110 -v "$PWD/meshes:/meshes:ro" ameisennav
          sleep 2
          docker logs anav
          test "$(docker inspect -f '{{.State.Running}}' anav)" = true
          docker stop anav
          test "$(docker inspect -f '{{.State.ExitCode}}' anav)" = 0

      - name: Push to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${GITHUB_REF_NAME#v}" latest; do
            docker tag ameisennav "$image:$tag"
            docker push "$image:$tag"
          done

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, sanitizers, windows, dotnet, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          cd artifacts
          chmod +x AmeisenNavigation-linux-x64/*
          tar -czf AmeisenNavigation-linux-x64.tar.gz -C AmeisenNavigation-linux-x64 .
          (cd AmeisenNavigation-windows-x64 && zip -r ../AmeisenNavigation-windows-x64.zip .)

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/AmeisenNavigation-linux-x64.tar.gz
            artifacts/AmeisenNavigation-windows-x64.zip
          generate_release_notes: true
